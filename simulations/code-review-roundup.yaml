# Code Review Roundup — PRs racing through the review gauntlet
#
# Five pull requests compete to get merged. Reviews, CI checks,
# merge conflicts, and change requests stand in the way.

name: "Code Review Roundup"

# ---------------------------------------------------------------------------
# Simulation data
# ---------------------------------------------------------------------------

simulation:
  runs:
    - provider: "feature"
      display_name: "feat/auth-overhaul"
      model_id: "auth-overhaul"
      rpm: 10
      timing: [14, 30]
    - provider: "bugfix"
      display_name: "fix/payment-race-condition"
      model_id: "payment-fix"
      rpm: 10
      timing: [8, 18]
    - provider: "refactor"
      display_name: "refactor/api-v2-migration"
      model_id: "api-v2"
      rpm: 8
      timing: [16, 35]
    - provider: "feature"
      display_name: "feat/real-time-notifications"
      model_id: "realtime-notifs"
      rpm: 10
      timing: [12, 26]
    - provider: "chore"
      display_name: "chore/dependency-upgrade"
      model_id: "dep-upgrade"
      rpm: 10
      timing: [6, 14]

  tasks:
    - "open - PR created and description written - v1"
    - "ci - lint check running - v1"
    - "ci - unit tests running - v1"
    - "ci - integration tests running - v1"
    - "ci - build verification - v1"
    - "review - first reviewer assigned - v1"
    - "review - initial code review comments - v1"
    - "revision - addressing review feedback round 1 - v1"
    - "ci - re-running checks after push - v1"
    - "review - second reviewer looking at changes - v1"
    - "review - architecture discussion in comments - v1"
    - "revision - addressing review feedback round 2 - v1"
    - "ci - all checks passing - v1"
    - "conflict - merge conflict with main detected - v1"
    - "conflict - rebasing and resolving conflicts - v1"
    - "ci - final check run after rebase - v1"
    - "review - final approval received - v1"
    - "review - second approval received - v1"
    - "merge - squash and merge to main - v1"
    - "post-merge - branch cleanup and ticket update - v1"

  error_rate: 0.15
  error_messages:
    - "CHANGES REQUESTED: needs error handling for edge case"
    - "MERGE CONFLICT: 4 files conflict with main"
    - "CI REGRESSION: integration test broke after rebase"
    - "REVIEW BLOCKED: waiting on team lead approval"
    - "NACK: reviewer disagrees with approach"
    - "STALE: branch is 47 commits behind main"

# ---------------------------------------------------------------------------
# Announcer config
# ---------------------------------------------------------------------------

completion_marker: "all tasks in all configurations have finished on all providers"

leaderboard_command: >
  grep "task has finished" {log_file}
  | sed 's/.*] //'
  | cut -d: -f1-2
  | sort | uniq -c | sort -rn

contestants:
  - "feat/auth-overhaul"
  - "fix/payment-race-condition"
  - "refactor/api-v2-migration"
  - "feat/real-time-notifications"
  - "chore/dependency-upgrade"

provider_short_names:
  feature: "Features"
  bugfix: "Bugfixes"
  refactor: "Refactors"
  chore: "Chores"

persona: |
  Rodeo announcer narrating pull requests trying to survive the review gauntlet.
  Rodeo metaphors: getting bucked, hanging on, riding to the buzzer, wrangling conflicts.
  Treat merge conflicts as wild broncos. Change requests are judges scoring low.
  Approvals are the crowd going wild. Merges are victorious dismounts.
  Call out which PR is closest to merging and who just got bucked by CI.
  2-4 sentences, under 80 words, plain ASCII only.

voice: "af_sky"
speed: 0.9

log_lines_per_minute: 50
